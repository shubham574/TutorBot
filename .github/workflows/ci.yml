name: TutorBot CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly security scan
    - cron: '0 3 * * 1'

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for gitleaks

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Run Test Suite (pytest)
        env:
          DRY_RUN: "true"
          WHATSAPP_APP_SECRET: "ci_test_secret"
          WHATSAPP_VERIFY_TOKEN: "ci_verify_token"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest -v

      - name: Run CI Evaluation & Safety Harness
        run: |
          python -m evals.runner

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit[toml] gitleaks

      - name: Run pip-audit (vulnerability scanning)
        run: |
          pip-audit --desc --format=json --output=pip-audit-report.json || true
          pip-audit --desc

      - name: Run bandit (static security analysis)
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ --severity-level medium --confidence-level medium

      - name: Run gitleaks (secret detection)
        run: |
          gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json || true

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
            gitleaks-report.json
          retention-days: 30

      - name: Fail on critical vulnerabilities
        run: |
          # Fail if pip-audit finds critical vulnerabilities
          if [ -f pip-audit-report.json ]; then
            CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.fix_versions[0] | test("critical"; "i"))] | length' pip-audit-report.json)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "Found $CRITICAL_COUNT critical vulnerabilities"
              exit 1
            fi
          fi

          # Fail if bandit finds high severity issues
          if [ -f bandit-report.json ]; then
            HIGH_COUNT=$(jq '[.results[] | select(.severity == "HIGH")] | length' bandit-report.json)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "Found $HIGH_COUNT high severity security issues"
              exit 1
            fi
          fi

          # Fail if gitleaks finds secrets
          if [ -f gitleaks-report.json ]; then
            LEAK_COUNT=$(jq 'length' gitleaks-report.json)
            if [ "$LEAK_COUNT" -gt 0 ]; then
              echo "Found $LEAK_COUNT potential secrets"
              exit 1
            fi
          fi

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high